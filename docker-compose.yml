version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: policylens_backend

    ports:
      - "8000:8000"

    volumes:
      - ./chroma_db:/app/chroma_db

    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: policylens_frontend

    ports:
      - "8501:8501"

    depends_on:
      - backend

    env_file:
      - .env