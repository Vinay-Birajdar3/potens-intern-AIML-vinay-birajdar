services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: policylens_backend

    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"

    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    volumes:
      - ./chroma_db:/app/chroma_db
      - ./documents:/app/documents:ro
      - model_cache:/home/policylens/.cache/huggingface
      - ../rag-evaluations:/external
      - ../rag_evaluation_report.json:/external/rag_evaluation_report.json:ro
      - ../rag_evaluation_report.json:/external/rag_evaluation_report.json:ro

    env_file:
      - .env

    environment:
      CHROMA_DB_PATH: /app/chroma_db/index
      DOCUMENTS_PATH: /app/documents
      APP_ENV: ${APP_ENV:-development}
      APP_API_KEY: ${APP_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      LIVE_EVALUATION_ENABLED: "true"
      RAG_EVAL_REPORT_PATH: /external/rag_evaluation_report.xlsx
      HF_HOME: /home/policylens/.cache/huggingface

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: policylens_frontend

    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8501}:8080"

    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /etc/nginx/conf.d:mode=1777
      - /var/cache/nginx:mode=1777
      - /var/run:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    depends_on:
      backend:
        condition: service_healthy

    environment:
      APP_API_KEY: ${APP_API_KEY:-}
      NGINX_ENVSUBST_FILTER: ^APP_API_KEY$

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped

  evaluation:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: evaluation

    profiles:
      - evaluation

    env_file:
      - .env

    environment:
      CHROMA_DB_PATH: /app/chroma_db/index
      DOCUMENTS_PATH: /app/documents
      LIVE_EVALUATION_ENABLED: "true"
      RAG_EVAL_REPORT_PATH: /external/rag_evaluation_report.xlsx

    volumes:
      - ./chroma_db:/app/chroma_db
      - ./documents:/app/documents:ro
      - model_cache:/home/policylens/.cache/huggingface
      - ../rag-evaluations:/external
      - ../rag_evaluation_report.json:/external/rag_evaluation_report.json:ro
      - ../rag_evaluation_report.json:/external/rag_evaluation_report.json:ro

    command: ["python", "run_deepeval.py"]

volumes:
  model_cache:
